apiVersion: v1
kind: Pod
metadata:
  name: flask-counter
  namespace: migration-demo
spec:
  nodeName: infra-demo
  restartPolicy: Never
  containers:
  - name: flask-container
    image: localhost/flask-checkpoint:latest
    imagePullPolicy: Never
    ports:
    - containerPort: 8080
      hostPort: 8080
    securityContext:
      appArmorProfile:
        type: Unconfined
