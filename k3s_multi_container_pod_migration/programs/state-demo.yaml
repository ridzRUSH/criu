apiVersion: v1
kind: Pod
metadata:
  name: state-demo
  namespace: migration-demo
spec:
  nodeName: vm2
  restartPolicy: Never
  securityContext:
    appArmorProfile:
      type: Unconfined
  containers:
  - name: redis
    image: docker.io/library/redis:7-alpine
    imagePullPolicy: Never
    args: ["redis-server", "--save", "", "--appendonly", "no", "--bind", "127.0.0.1"]
  - name: flask
    image: localhost/flask-redis:latest
    imagePullPolicy: Never
    ports:
    - containerPort: 8080
      hostPort: 8080
